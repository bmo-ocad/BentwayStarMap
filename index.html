<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Live Star Map</title>

  <!-- Lets iPhones add this page to the home screen and open it without the
       browser bars. "Star Map" is the name shown under the icon. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Star Map">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-60.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The sky is drawn on this canvas. -->
  <canvas id="sky"></canvas>

  <!-- The box that locks onto a tapped star. -->
  <div id="info" hidden>
    <button id="info-close" type="button" aria-label="Close">×</button>
    <div id="info-title"></div>
    <div id="info-sub"></div>
    <dl id="info-facts"></dl>
    <p id="info-blurb"></p>
  </div>

  <!-- Small status line. Fades out when the mouse is still, so it stays off the wall. -->
  <div id="hud" class="fades"></div>
  <button id="open-settings" class="fades" title="Settings (S)">Settings</button>

  <!-- Switches between Window mode and Pointer mode. Only shown on devices with motion sensors. -->
  <button id="mode-toggle" class="fades" hidden>Pointer mode</button>
  <div id="toast" hidden></div>

  <!-- Settings panel. Each control's id matches the setting it changes in js/main.js. -->
  <div id="panel" hidden>
    <h1>Live Star Map</h1>
    <p id="panel-note"></p>

    <h2>Location</h2>
    <label>Latitude (north is positive)
      <input id="lat" type="number" min="-90" max="90" step="0.01">
    </label>
    <label>Longitude (east is positive, west is negative)
      <input id="lon" type="number" min="-180" max="180" step="0.01">
    </label>
    <button id="locate" type="button">Use my location</button>

    <h2>View</h2>
    <label>Wall faces (compass degrees: 0 north, 90 east, 180 south, 270 west)
      <input id="yaw" type="number" min="0" max="359" step="1">
    </label>
    <label>Tilt above the horizon (degrees)
      <input id="pitch" type="number" min="-30" max="90" step="1">
    </label>
    <label>Width of view (degrees)
      <input id="fov" type="number" min="20" max="120" step="1">
    </label>

    <h2>Display</h2>
    <label>Star size and glow
      <input id="starBoost" type="range" min="0.6" max="2.6" step="0.1">
    </label>
    <label>Label detail
      <input id="labelDetail" type="range" min="0" max="4" step="0.5">
    </label>
    <label class="check"><input id="showLabels" type="checkbox"> Star labels</label>
    <label class="check"><input id="showConNames" type="checkbox"> Constellation names</label>
    <label class="check"><input id="showLines" type="checkbox"> Constellation lines</label>

    <div id="pointer-settings" hidden>
      <h2>Pointer mode</h2>
      <label>Aim with
        <select id="aim">
          <option value="back">Back of the phone</option>
          <option value="top">Top edge, like a remote</option>
        </select>
      </label>
      <label>Steadiness (more is smoother but slower to follow)
        <input id="pointerSmooth" type="range" min="0.08" max="0.8" step="0.02">
      </label>
      <button id="reset-cal" type="button">Clear compass correction</button>
    </div>

    <div class="row">
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="close-panel" type="button">Done</button>
    </div>

    <p class="help">
      Drag to look around and click a star for details. Arrow keys pan,
      + and − zoom, F is fullscreen, S opens this panel.
    </p>
  </div>

  <script src="data/stars.js"></script>
  <script src="data/constellations.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/view.js"></script>
  <script src="js/render.js"></script>
  <script src="js/info.js"></script>
  <script src="js/window.js"></script>
  <script src="js/pointer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
